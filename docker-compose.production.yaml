version: '3'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env ## Change this file for customized env variables
    volumes:
      - /data/storage:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.eezibot-web.rule=Host(`eezibot.com`)
      - traefik.http.routers.eezibot-web.entrypoints=web
      - traefik.http.routers.eezibot-web.middlewares=redirect-to-https
      - traefik.http.services.eezibot-web.loadbalancer.server.port=3000
      - traefik.http.routers.eezibot-websecure.rule=Host(`eezibot.com`)
      - traefik.http.routers.eezibot-websecure.entrypoints=websecure
      - traefik.http.routers.eezibot-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.eezibot-websecure.loadbalancer.server.port=3000
    networks:
      - default
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    networks:
      - default
      - dokploy-network

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword123}
    networks:
      - default

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - /data/redis:/data
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - default

networks:
  dokploy-network:
    external: true
